# Verifies Helios on a clean machine.
#
# This exists because of a real failure: the checked-in virtualenv drifted from
# `pyproject.toml`, four declared dependencies were missing, and the whole pytest suite failed at
# collection. Nothing caught it, because nothing had ever built this project anywhere but the
# author's laptop. A clean-checkout run is the point.
#
# Installs are pinned through `constraints.txt` and `package-lock.json`, so a green run here means
# a specific dependency set was green -- not "whatever resolved today".

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # No credentials in CI: every suite runs against fixtures and stubs by design.
  CI: "true"

jobs:
  backend:
    name: backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Kept in step with .python-version, Dockerfile, and `requires-python`.
          python-version-file: .python-version
          cache: pip

      - name: Install with pinned versions
        run: python -m pip install -e ".[dev,desktop]" -c constraints.txt

      - name: Preflight
        # Runs first and on its own so a dependency gap reports as one sentence naming the
        # missing distributions, rather than as fifteen collection errors further down.
        run: helios-preflight

      - name: Ruff
        run: ruff check src tests

      - name: Mypy (strict)
        run: mypy

      - name: Pytest
        run: pytest -q

  web:
    name: web (eslint, tsc, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Install Chromium
        # Only the browser the config actually projects, with its system deps.
        run: npx playwright install --with-deps chromium

      - name: Playwright
        # The config builds the app and starts a stub API itself, so this needs no credentials,
        # no database, and no network.
        run: npm run test:e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
