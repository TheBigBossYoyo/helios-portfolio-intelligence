name: helios

# Bounded json-file logs for every service. Docker's default keeps container logs forever, which
# on a machine left running for months is a slow disk leak. 3 x 10 MB is weeks of Helios output.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: helios-backend:local
    entrypoint: ["/app/docker/api-entrypoint.sh"]
    command: ["uvicorn", "helios.app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment:
      HELIOS_DATA_DIR: /app/data
      # The dashboard's server-side fetches arrive from the `web` container's bridge address, not
      # from loopback, so the settings routes have to be told that peer is the dashboard.
      HELIOS_SETTINGS_TRUSTED_PEERS: web
      # Compose injects the host .env as environment variables, which outrank any file the
      # container could write, and the image has no OS keyring. A settings change saved from the
      # dashboard would never be read, so the page is read-only here: edit .env on the host and
      # run `docker compose up -d`.
      HELIOS_SETTINGS_WRITABLE: "false"
    ports:
      # Loopback-only by design: the API is never exposed beyond this machine.
      - "127.0.0.1:${HELIOS_API_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    logging: *logging
    cpus: "1.0"
    mem_limit: 1g
    restart: unless-stopped

  web:
    build:
      context: ./web
    environment:
      HELIOS_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${HELIOS_WEB_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *logging
    cpus: "1.0"
    mem_limit: 512m
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: helios-backend:local
    command: ["helios-worker"]
    env_file:
      - path: .env
        required: false
    environment:
      HELIOS_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import sys; cmd = Path('/proc/1/cmdline').read_bytes().decode('utf-8', errors='ignore'); sys.exit(0 if 'helios-worker' in cmd else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *logging
    cpus: "1.0"
    mem_limit: 1g
    restart: unless-stopped
