name: helios

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: helios-backend:local
    entrypoint: ["/app/docker/api-entrypoint.sh"]
    command: ["uvicorn", "helios.app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment:
      HELIOS_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:${HELIOS_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    restart: unless-stopped

  web:
    build:
      context: ./web
    environment:
      HELIOS_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${HELIOS_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: helios-backend:local
    command: ["helios-worker"]
    env_file:
      - path: .env
        required: false
    environment:
      HELIOS_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import sys; cmd = Path('/proc/1/cmdline').read_bytes().decode('utf-8', errors='ignore'); sys.exit(0 if 'helios-worker' in cmd else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
