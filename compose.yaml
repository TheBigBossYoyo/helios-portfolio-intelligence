name: helios

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: helios-backend:local
    entrypoint: ["/app/docker/api-entrypoint.sh"]
    command: ["uvicorn", "helios.app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment:
      HELIOS_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:${HELIOS_API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  web:
    build:
      context: ./web
    env_file:
      - path: .env
        required: false
    environment:
      HELIOS_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${HELIOS_WEB_PORT:-3000}:3000"
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: helios-backend:local
    command: ["helios-worker"]
    env_file:
      - path: .env
        required: false
    environment:
      HELIOS_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped
